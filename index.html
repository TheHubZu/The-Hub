<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hub - Zayed University</title>
    <style>
        /* General Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        .logo {
            width: 800px; 
            height: auto;
            max-width: 90vw;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            color: #1a1a1a;
            font-size: 24px;
            margin: 0 0 10px 0;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            max-width: 400px;
            line-height: 1.5;
            margin: 0 auto 30px auto;
        }

        /* Container */
        .container {
            width: 90%;
            max-width: 500px;
            background: #f9f9f9;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            position: relative;
        }

        /* Form Elements */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        select, input[type="password"], input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #b84e60; 
            box-shadow: 0 0 5px rgba(184, 78, 96, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #b84e60; 
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #984447; 
        }

        .error-message {
            color: red;
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }

        /* Main View */
        #main-view {
            display: none; 
            position: relative;
        }

        #welcome-message {
            margin-top: 0;
            text-align: center;
            color: #b84e60;
            font-size: 22px;
            line-height: 1.4;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* iPhone Contacts Style List Container */
        .list-container {
            position: relative;
            height: 400px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            overflow: hidden;
        }

        ul#places-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            height: 100%;
            overflow-y: auto;
            scroll-behavior: smooth; /* Smooth scrolling */
        }

        /* Hide scrollbar for cleaner look (optional, but iPhone-like) */
        ul#places-list::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        /* Section Headers (A, B, C...) */
        .list-header {
            background-color: #f4f4f4;
            color: #666;
            font-weight: bold;
            padding: 5px 15px;
            font-size: 14px;
            position: sticky;
            top: 0;
            z-index: 10; /* Keep header on top while scrolling */
            border-bottom: 1px solid #eee;
            border-top: 1px solid #eee;
        }

        ul#places-list li.contact-item {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            margin-right: 25px; /* Space for the index */
        }

        ul#places-list li.contact-item:last-child {
            border-bottom: none;
        }

        ul#places-list li.contact-item:hover {
            background-color: #fcf0f1; 
        }

        /* The Alphabet Index Sidebar */
        #alphabet-index {
            position: absolute;
            right: 5px;
            top: 10px;
            bottom: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            width: 20px;
            font-size: 10px;
            font-weight: bold;
            color: #b84e60;
            cursor: pointer;
            user-select: none;
            touch-action: none; /* Crucial for touch dragging */
            z-index: 20;
        }

        .index-letter {
            width: 100%;
            text-align: center;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Bubble indicator for current letter while dragging */
        #letter-indicator {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background-color: rgba(184, 78, 96, 0.9);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 30;
        }

        #location-result {
            margin-top: 20px;
            padding: 20px; 
            background-color: #fcf0f1; 
            border-left: 5px solid #b84e60; 
            border-radius: 4px;
            display: none;
            text-align: center; 
        }

        #location-result h3 {
            margin: 0 0 10px 0;
            color: #b84e60; 
            font-size: 24px; 
        }

        #location-result p {
            margin: 0;
            font-size: 18px; 
            color: #333;
        }

    </style>
</head>

        const allItems = [...departments, ...professors];

        // The Alphabet Array
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

        function login() {
            const User = document.getElementById('User').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            const correctPassword = User + "!!";

            if (password === correctPassword) {
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('main-view').style.display = 'block';
                
                // Welcome user
                const welcomeMsg = document.getElementById('welcome-message');
                welcomeMsg.innerHTML = "Welcome " + User + "!<br>What place are you looking for?";
                
                // Render List with Headers
                renderListWithHeaders(allItems);
                createAlphabetIndex();
            } else {
                errorMsg.style.display = 'block';
            }
        }

        // Functions to Group data by starting letter
        function groupData(items) {
            const grouped = {};
            
            // Put departments in a special category at the top
            grouped['Departments'] = items.filter(item => departments.includes(item));
            
            // Group professors by letter
            const profs = items.filter(item => professors.includes(item));
            alphabet.forEach(letter => {
                const startsWithLetter = profs.filter(item => item.name.toUpperCase().startsWith(letter));
                if (startsWithLetter.length > 0) {
                    grouped[letter] = startsWithLetter;
                }
            });

            return grouped;
        }

        function renderListWithHeaders(items) {
            const listElement = document.getElementById('places-list');
            listElement.innerHTML = ''; 

            const groupedData = groupData(items);

            for (const [groupName, groupItems] of Object.entries(groupedData)) {
                if (groupItems.length > 0) {
                    // Create Header (A, B, C or Departments)
                    const headerLi = document.createElement('li');
                    headerLi.className = 'list-header';
                    // We assign an ID to the header so we can scroll to it
                    headerLi.id = 'header-' + groupName; 
                    headerLi.textContent = groupName;
                    listElement.appendChild(headerLi);

                    // Create Items under Header
                    groupItems.forEach(item => {
                        const li = document.createElement('li');
                        li.className = 'contact-item';
                        li.textContent = item.name;
                        li.onclick = () => showLocation(item);
                        listElement.appendChild(li);
                    });
                }
            }
        }

        // --- iPhone Slider Logic ---
        let isDragging = false;

        function createAlphabetIndex() {
            const indexContainer = document.getElementById('alphabet-index');
            indexContainer.innerHTML = ''; // Clear if re-rendered

            alphabet.forEach(letter => {
                const span = document.createElement('span');
                span.className = 'index-letter';
                span.dataset.letter = letter; // Store letter for touch logic
                span.textContent = letter;
                
                // Click logic for Desktop
                span.onclick = () => scrollToLetter(letter);
                indexContainer.appendChild(span);
            });

            // Touch & Drag logic for Mobile (iPhone behavior)
            indexContainer.addEventListener('pointerdown', handlePointerDown);
            indexContainer.addEventListener('pointermove', handlePointerMove);
            window.addEventListener('pointerup', handlePointerUp);
            window.addEventListener('pointercancel', handlePointerUp);
        }

        function handlePointerDown(e) {
            isDragging = true;
            document.getElementById('alphabet-index').setPointerCapture(e.pointerId);
            processTouch(e);
        }

        function handlePointerMove(e) {
            if (!isDragging) return;
            e.preventDefault(); // Prevent page scroll while dragging index
            processTouch(e);
        }

        function handlePointerUp(e) {
            isDragging = false;
            document.getElementById('letter-indicator').style.opacity = '0';
        }

        function processTouch(e) {
            const element = document.elementFromPoint(e.clientX, e.clientY);
            if (element && element.classList.contains('index-letter')) {
                const letter = element.dataset.letter;
                
                // Show floating bubble indicator
                const indicator = document.getElementById('letter-indicator');
                indicator.textContent = letter;
                
                // Calculate position for bubble to follow finger
                const rect = element.getBoundingClientRect();
                const containerRect = document.querySelector('.list-container').getBoundingClientRect();
                // Position relative to the container
                indicator.style.top = (rect.top - containerRect.top + (rect.height / 2)) + 'px';
                indicator.style.opacity = '1';

                scrollToLetter(letter);
            }
        }

        function scrollToLetter(letter) {
            const header = document.getElementById('header-' + letter);
            if (header) {
                const list = document.getElementById('places-list');
                // Calculate position of header relative to the scrolling list container
                const listRect = list.getBoundingClientRect();
                const headerRect = header.getBoundingClientRect();
                
                // Scroll to the specific position
                list.scrollTop = list.scrollTop + (headerRect.top - listRect.top);
            }
        }

        // --- Search Logic (Filters Full List) ---
        function handleSearch() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            if (query.trim() === '') {
                // If search is empty, show full grouped list
                renderListWithHeaders(allItems);
                return;
            }

            // If searching, show a flat filtered list without A-Z headers
            const filtered = allItems.filter(item => 
                item.name.toLowerCase().includes(query)
            );
            
            const listElement = document.getElementById('places-list');
            listElement.innerHTML = '';
            filtered.forEach(item => {
                const li = document.createElement('li');
                li.className = 'contact-item';
                li.textContent = item.name;
                li.onclick = () => showLocation(item);
                listElement.appendChild(li);
            });
            
            document.getElementById('location-result').style.display = 'none';
        }

        function showLocation(department) {
            document.getElementById('result-name').textContent = department.name;
            let formattedLocation = department.location;
            if(formattedLocation === "ADMIN, GF") formattedLocation = "Administration Building, Ground Floor (GF)";
            if(formattedLocation === "ADMIN, First Floor") formattedLocation = "Administration Building, First Floor";
            if(formattedLocation === "LIBRARY, First Floor") formattedLocation = "Library Building, First Floor";
            
            document.getElementById('result-location').textContent = "Location: " + formattedLocation;
            document.getElementById('location-result').style.display = 'block';
        }
    </script>
</body>
</html>
