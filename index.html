<head>
    <meta charset="UTF-8">

    <title>The Hub - Zayed University</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        .logo {
            width: 800px; 
            height: auto;
            max-width: 90vw;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            color: #1a1a1a;
            font-size: 24px;
            margin: 0 0 10px 0;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            max-width: 400px;
            line-height: 1.5;
            margin: 0 auto 30px auto;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: #f9f9f9;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #b84e60; 
            box-shadow: 0 0 5px rgba(184, 78, 96, 0.2);
        }

        #main-view {
            display: block; 
        }

        #welcome-message {
            margin-top: 0;
            text-align: center;
            color: #b84e60;
            font-size: 22px;
            line-height: 1.4;
            font-weight: bold;
        }

        ul#places-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
        }

        ul#places-list li {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        ul#places-list li:last-child {
            border-bottom: none;
        }

        ul#places-list li:hover {
            background-color: #fcf0f1; 
            color: #b84e60; 
        }

        #location-result {
            margin-top: 25px;
            padding: 25px; 
            background-color: #fcf0f1; 
            border-left: 5px solid #b84e60; 
            border-radius: 4px;
            display: none;
            text-align: center; 
        }

        #location-result h3 {
            margin: 0 0 10px 0;
            color: #b84e60; 
            font-size: 32px; 
        }

        #location-result p {
            margin: 0;
            font-size: 24px; 
            color: #333;
        }
    </style>
</head>

        const resultDiv = document.getElementById('location-result');
        const resultName = document.getElementById('result-name');
        const resultLocation = document.getElementById('result-location');

        function renderList(items) {
            listElement.innerHTML = ''; 
            items.forEach(dept => {
                const li = document.createElement('li');
                li.textContent = dept.name;
                li.onclick = () => showLocation(dept);
                listElement.appendChild(li);
            });
        }

        function filterLocations() {
            const query = searchInput.value.toLowerCase();
            const filtered = allItems.filter(dept => 
                dept.name.toLowerCase().includes(query)
            );
            renderList(filtered);
            resultDiv.style.display = 'none';
        }

        function showLocation(department) {
            resultName.textContent = department.name;
            resultLocation.textContent = "Location: " + department.location;
            resultDiv.style.display = 'block';
