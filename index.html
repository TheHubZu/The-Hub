    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header { text-align: center; margin-top: 40px; margin-bottom: 20px; }

        .logo {
            width: 800px; 
            height: auto;
            max-width: 90vw;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: #f9f9f9;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            position: relative;
            padding-right: 40px;
        }

        /* The real sidebar style with touch-action none to prevent page scroll while swiping */
        #alphabet-index {
            position: absolute;
            right: 5px;
            top: 100px;
            bottom: 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
            color: #b84e60;
            cursor: pointer;
            user-select: none;
            touch-action: none; /* Prevents the screen from scrolling when sliding on the letters */
        }

        #alphabet-index span {
            padding: 2px 5px;
        }

        #alphabet-index span:hover, #alphabet-index span.active-letter {
            color: #984447;
            background: #eee;
            border-radius: 50%;
            width: 15px;
            text-align: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        ul#places-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
        }

        ul#places-list li {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        ul#places-list li:hover { background-color: #fcf0f1; color: #b84e60; }

        #location-result {
            margin-top: 25px;
            padding: 25px; 
            background-color: #fcf0f1; 
            border-left: 5px solid #b84e60; 
            border-radius: 4px;
            display: none;
            text-align: center; 
        }

        #location-result h3 { margin: 0 0 10px 0; color: #b84e60; font-size: 32px; }
        #location-result p { margin: 0; font-size: 24px; color: #333; }
    </style>

            renderList(allItems);
            createIndex();
        };

        // Swipe & scrub logic for alphabetical index
        let isDragging = false;

        function createIndex() {
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
            letters.forEach(letter => {
                const span = document.createElement('span');
                span.textContent = letter;
                span.onclick = () => filterByLetter(letter);
                indexContainer.appendChild(span);
            });

            // Pointer events for dragging/swiping like iPhone contacts
            indexContainer.addEventListener('pointerdown', function(e) {
                isDragging = true;
                indexContainer.setPointerCapture(e.pointerId);
                handleSwipe(e);
            });

            indexContainer.addEventListener('pointermove', function(e) {
                if (isDragging) {
                    handleSwipe(e);
                }
            });

            indexContainer.addEventListener('pointerup', function(e) {
                isDragging = false;
                indexContainer.releasePointerCapture(e.pointerId);
            });

            indexContainer.addEventListener('pointercancel', function(e) {
                isDragging = false;
            });
        }

        function handleSwipe(e) {
            e.preventDefault();
            const elem = document.elementFromPoint(e.clientX, e.clientY);
            if (elem && elem.tagName === 'SPAN' && elem.parentElement === indexContainer) {
                filterByLetter(elem.textContent);
            }
        }

        function filterByLetter(letter) {
            const filtered = allItems.filter(item => 
                item.name.toUpperCase().startsWith(letter)
            );
            renderList(filtered);
            document.getElementById('location-result').style.display = 'none';
        }

        function renderList(items) {
            const listElement = document.getElementById('places-list');
            listElement.innerHTML = ''; 
            items.forEach(dept => {
                const li = document.createElement('li');
                li.textContent = dept.name;
                li.onclick = () => showLocation(dept);
                listElement.appendChild(li);
            });
        }

        function filterLocations() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const filtered = allItems.filter(dept => 
                dept.name.toLowerCase().includes(query)
            );
            renderList(filtered);
            document.getElementById('location-result').style.display = 'none';
        }

        function showLocation(department) {
            document.getElementById('result-name').textContent = department.name;
            let formattedLocation = department.location;
            if(formattedLocation === "ADMIN, GF") formattedLocation = "Administration Building, Ground Floor (GF)";
            if(formattedLocation === "ADMIN, First Floor") formattedLocation = "Administration Building, First Floor";
            if(formattedLocation === "LIBRARY, First Floor") formattedLocation = "Library Building, First Floor";
            
            document.getElementById('result-location').textContent = "Location: " + formattedLocation;
            document.getElementById('location-result').style.display = 'block';
        }
